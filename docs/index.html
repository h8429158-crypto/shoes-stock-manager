<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A fast, offline expense tracker. Tap in what you spend, browse your history, and see where your money goes.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spend">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Spend</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0E0E0E;
    --surface-alt: #171717;
    --elev: #1E1E1E;
    --border: #262626;
    --text: #FFFFFF;
    --dim: #A1A1A1;
    --faint: #6B6B6B;
    --accent: #FFD60A;          /* yellow selected state */
    --accent-dim: #4a4210;
    --credit: #32D74B;          /* money received */
    --danger: #FF453A;
    --track: #1C1C1C;
    --sys: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: #000; }
  body {
    margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none;
    font-family: var(--sys); color: var(--text); background: #000;
    -webkit-font-smoothing: antialiased;
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    touch-action: manipulation;
  }
  button, input { font-family: var(--sys); }
  input { -webkit-appearance: none; appearance: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Anchored to all four screen edges — resilient to the iOS standalone
     launch-height bug, where vh/dvh/100% resolve against a stale viewport. */
  .app {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    max-width: 520px; margin: 0 auto;
    background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  @media (max-width: 520px) { .app { border-left: none; border-right: none; } }

  .screen {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }
  /* History wraps its content in .screen-inner so the sticky total pins to the
     bottom of the viewport even when the list is too short to fill it. */
  .screen-inner { flex: 1; display: flex; flex-direction: column; min-height: 100%; }
  .screen-inner .pad { flex: 1; }
  .pad { padding: calc(env(safe-area-inset-top) + 14px) 18px 20px; }
  .fade { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------------- bottom nav ---------------- */
  .nav {
    flex: none; display: flex; align-items: stretch;
    padding: 8px 8px calc(env(safe-area-inset-bottom) + 10px);
    background: #0A0A0A; border-top: 1px solid var(--border);
  }
  .nav button {
    flex: 1; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--faint); padding: 6px 0; transition: color .18s;
  }
  .nav button .lbl { font-size: 11px; font-weight: 700; letter-spacing: .01em; }
  .nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav button.active { color: var(--accent); }
  .nav .tapbtn .ring {
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--surface-alt); transition: background .18s, box-shadow .18s; margin-top: -2px;
  }
  .nav .tapbtn svg { width: 26px; height: 26px; }
  .nav .tapbtn.active .ring { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim), 0 8px 20px -6px rgba(255,214,10,.5); }
  .nav .tapbtn.active { color: var(--accent); }
  .nav .tapbtn.active .ring svg { stroke: #000; }

  /* ---------------- generic ---------------- */
  .h-title { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .h-sub { color: var(--dim); font-size: 14px; margin: 4px 0 0; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .iconbtn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn:active { transform: scale(.95); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  .empty { text-align: center; color: var(--dim); padding: 48px 20px; }
  .empty .em { font-size: 44px; }
  .empty .t { font-size: 16px; font-weight: 700; color: var(--text); margin-top: 10px; }
  .empty .s { font-size: 14px; margin-top: 4px; }

  /* ---------------- TAP tab ---------------- */
  .tap { flex: 1; display: flex; flex-direction: column; }
  .tap-top { padding: calc(env(safe-area-inset-top) + 16px) 18px 0; text-align: center; }
  .tap-top .q { color: var(--dim); font-size: 15px; font-weight: 600; }
  .amount { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 8px 0 2px; }
  .amount .cur { font-size: 34px; font-weight: 700; color: var(--dim); }
  .amount .val { font-size: 58px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .amount.credit .val, .amount.credit .cur { color: var(--credit); }
  .amount.zero .val, .amount.zero .cur { color: var(--faint); }

  .chips { display: flex; gap: 9px; overflow-x: auto; padding: 4px 18px 2px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; scroll-snap-align: start; display: flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1.5px solid var(--border); color: var(--dim);
    padding: 9px 15px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: border-color .16s, color .16s, background .16s;
  }
  .chip .e { font-size: 17px; }
  .chip.sel { border-color: var(--accent); color: var(--text); background: var(--surface-alt);
    box-shadow: 0 0 0 3px var(--accent-dim), 0 0 14px -2px rgba(255,214,10,.35); }

  .noterow { padding: 12px 18px 0; }
  .noteinput {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-size: 15px; padding: 12px 14px;
  }
  .noteinput::placeholder { color: var(--faint); }

  .keypad-wrap { margin-top: auto; padding: 10px 14px 0; }
  .credit-toggle {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px auto 10px;
    background: var(--surface); border: 1.5px solid var(--border); color: var(--dim);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; width: fit-content;
    transition: border-color .16s, color .16s, background .16s;
  }
  .credit-toggle .sw { width: 34px; height: 20px; border-radius: 999px; background: var(--border); position: relative; transition: background .18s; }
  .credit-toggle .sw i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--faint); transition: left .18s, background .18s; }
  .credit-toggle.on { border-color: var(--credit); color: var(--credit); background: rgba(50,215,75,.08); }
  .credit-toggle.on .sw { background: rgba(50,215,75,.35); }
  .credit-toggle.on .sw i { left: 16px; background: var(--credit); }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key {
    border: none; background: var(--surface-alt); color: var(--text);
    font-size: 26px; font-weight: 600; border-radius: 16px; padding: 15px 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .12s, transform .08s;
  }
  .key:active { background: var(--elev); transform: scale(.97); }
  .key.fn { color: var(--dim); }
  .key svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .save-btn {
    width: 100%; margin-top: 10px; padding: 16px; border-radius: 16px; border: none;
    background: var(--accent); color: #000; font-size: 17px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .18s, transform .08s;
  }
  .save-btn:active { transform: scale(.99); }
  .save-btn.credit { background: var(--credit); color: #04220c; }
  .save-btn:disabled { opacity: .3; cursor: default; }

  /* ---------------- HISTORY tab ---------------- */
  .filters { display: flex; gap: 8px; margin-top: 16px; }
  .filter {
    flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--dim);
    padding: 9px 4px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .16s;
  }
  .filter.sel { background: var(--accent); border-color: var(--accent); color: #000; }

  .daygroup { margin-top: 22px; }
  .dayhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
  .dayhead .d { color: var(--dim); font-size: 12px; font-weight: 800; letter-spacing: .07em; }
  .dayhead .t { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

  .exp { display: flex; align-items: center; gap: 13px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 15px; padding: 12px 14px; margin-bottom: 9px; cursor: pointer; width: 100%; text-align: left;
    transition: transform .1s, background .16s; }
  .exp:active { transform: scale(.99); background: var(--surface-alt); }
  .exp .circ { width: 42px; height: 42px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .exp .mid { flex: 1; min-width: 0; }
  .exp .cn { font-size: 15px; font-weight: 700; }
  .exp .nt { color: var(--dim); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp .right { text-align: right; flex: none; }
  .exp .amt { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .exp .amt.credit { color: var(--credit); }
  .exp .tm { color: var(--faint); font-size: 12px; margin-top: 3px; }

  .sticky-total {
    position: sticky; bottom: 0; margin-top: auto;
    background: rgba(10,10,10,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); padding: 13px 18px calc(env(safe-area-inset-bottom) + 4px);
    cursor: pointer;
  }
  .sticky-total .line { display: flex; align-items: baseline; justify-content: space-between; }
  .sticky-total .lbl { font-size: 13px; color: var(--dim); font-weight: 600; }
  .sticky-total .v { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sticky-total .v .of { color: var(--faint); font-weight: 600; }
  .sticky-total .v.over { color: var(--danger); }
  .budgetbar { height: 7px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 8px; }
  .budgetbar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s cubic-bezier(.4,0,.2,1); }
  .budgetbar i.over { background: var(--danger); }

  /* ---------------- ANALYTICS tab ---------------- */
  .seg { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-top: 16px; }
  .seg button { flex: 1; border: none; background: none; color: var(--dim); font-size: 13px; font-weight: 700; padding: 8px 4px; border-radius: 9px; cursor: pointer; transition: .16s; }
  .seg button.sel { background: var(--accent); color: #000; }

  .bigstat { text-align: center; margin: 22px 0 6px; }
  .bigstat .l { color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .bigstat .v { font-size: 44px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .bigstat .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .bigstat .sub b.ok { color: var(--credit); } .bigstat .sub b.bad { color: var(--danger); }

  .twostat { display: flex; gap: 10px; margin-top: 16px; }
  .twostat .s { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; }
  .twostat .s .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .twostat .s .l { color: var(--dim); font-size: 12px; margin-top: 3px; }

  .sec { color: var(--dim); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin: 26px 2px 12px; }

  .chart { display: flex; align-items: flex-end; gap: 7px; height: 130px; padding: 0 2px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart .col .b { width: 68%; min-width: 6px; border-radius: 7px 7px 3px 3px; background: var(--accent); transition: height .4s cubic-bezier(.4,0,.2,1); }
  .chart .col .b.dim { background: #33300f; }
  .chartx { display: flex; gap: 7px; margin-top: 8px; }
  .chartx span { flex: 1; text-align: center; color: var(--faint); font-size: 11px; font-weight: 600; }

  .catrow { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
  .catrow:last-child { margin-bottom: 0; }
  .catrow .circ { width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .catrow .mid { flex: 1; min-width: 0; }
  .catrow .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .catrow .top .n { font-size: 14px; font-weight: 700; }
  .catrow .top .a { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .catrow .tr { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .catrow .fl { height: 100%; border-radius: 999px; transition: width .45s ease; }

  /* ---------------- overlay (edit / budget) ---------------- */
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 60; display: none; align-items: flex-end; }
  .overlay.show { display: flex; }
  .sheet {
    width: 100%; background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px;
    border-top: 1px solid var(--border); padding: 8px 18px calc(env(safe-area-inset-bottom) + 18px);
    max-height: 92%; overflow-y: auto; scrollbar-width: none; animation: slideup .28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet::-webkit-scrollbar { display: none; }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  .grabber { width: 40px; height: 5px; border-radius: 999px; background: var(--border); margin: 8px auto 14px; }
  .sheet h3 { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  .sheet .sub { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
  .field-lbl { color: var(--dim); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 8px; }
  .field-lbl:first-of-type { margin-top: 6px; }
  .input {
    width: 100%; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-size: 17px; padding: 13px 14px; font-variant-numeric: tabular-nums;
  }
  .input::placeholder { color: var(--faint); }
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips-wrap .chip { flex: none; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; }
  .btn:active { transform: scale(.99); }
  .btn-save { background: var(--accent); color: #000; }
  .btn-save:disabled { opacity: .4; }
  .btn-del { background: transparent; border: 1px solid var(--danger); color: var(--danger); flex: none; width: 56px; display: flex; align-items: center; justify-content: center; }
  .btn-del svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .credit-toggle.inline { margin: 0; width: 100%; justify-content: space-between; }

  /* toast */
  .toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translateX(-50%) translateY(14px);
    background: var(--accent); color: #000; font-weight: 800; font-size: 14px; padding: 11px 20px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 70; box-shadow: 0 10px 30px -8px rgba(255,214,10,.4); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.credit { background: var(--credit); color: #04220c; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="screen" id="screen"></div>
  <nav class="nav" id="nav">
    <button data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-8 5"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>
      <span class="lbl">History</span>
    </button>
    <button class="tapbtn" data-tab="tap">
      <span class="ring"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
      <span class="lbl">Tap</span>
    </button>
    <button data-tab="analytics">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="13" width="3" height="4" rx="1"/></svg>
      <span class="lbl">Analytics</span>
    </button>
  </nav>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"></div>
</div>

<script>
(function () {
  'use strict';

  // ---------------- categories ----------------
  const CATS = [
    { n: 'Shopping',      e: '🛍️', c: '#FF6B9D' },
    { n: 'Entertainment', e: '🎬', c: '#A78BFA' },
    { n: 'Health',        e: '🍎', c: '#34D399' },
    { n: 'Junk food',     e: '🍕', c: '#FB923C' },
    { n: 'Vehicles',      e: '🚗', c: '#60A5FA' },
    { n: 'Fuel',          e: '⛽', c: '#FBBF24' },
    { n: 'Rent',          e: '🏠', c: '#F87171' },
    { n: 'Medicine',      e: '💊', c: '#22D3EE' },
    { n: 'Education',     e: '📚', c: '#818CF8' },
    { n: 'Other',         e: '🎁', c: '#9CA3AF' },
  ];
  const CAT = {}; CATS.forEach(c => CAT[c.n] = c);
  const catOf = n => CAT[n] || { n: n || 'Other', e: '🎁', c: '#9CA3AF' };

  // ---------------- state / storage ----------------
  const KEY = 'expenseTracker.v1';
  function defaultState() { return { expenses: [], settings: { budget: 15000 }, nextId: 1 }; }
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || defaultState(); }
  catch (e) { S = defaultState(); }
  if (!S.settings) S.settings = { budget: 15000 };
  if (S.settings.budget == null) S.settings.budget = 15000;
  if (!Array.isArray(S.expenses)) S.expenses = [];
  if (!S.nextId) S.nextId = 1;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  const budget = () => Number(S.settings.budget) || 0;

  // ---------------- helpers ----------------
  const pad = n => (n < 10 ? '0' + n : '' + n);
  function fmtNum(n) {
    n = Number(n) || 0; const neg = n < 0; n = Math.abs(n);
    let i = Math.floor(n);
    const dec = Math.round((n - i) * 100);
    let s = String(i);
    if (s.length > 3) {
      const last3 = s.slice(-3);
      s = s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
    }
    if (dec > 0) s += '.' + pad(dec);
    return (neg ? '-' : '') + s;
  }
  const rupee = n => '₹' + fmtNum(n);
  function fmtEntry(entry) {
    if (!entry) return '0';
    let [i, d] = entry.split('.');
    i = i || '0';
    let gi = i;
    if (i.length > 3) gi = i.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + i.slice(-3);
    return d !== undefined ? gi + '.' + d : gi;
  }
  const WD = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
  const MO = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const WDS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  function fmtDayHead(key) {
    const [y, m, d] = key.split('-').map(Number); const dt = new Date(y, m - 1, d);
    const today = dayKey(Date.now());
    if (key === today) return 'TODAY · ' + `${MO[m - 1]} ${d}`;
    return `${WD[dt.getDay()]}, ${MO[m - 1]} ${d}`;
  }
  function fmtTime(ts) {
    const d = new Date(ts); let h = d.getHours(); const mn = d.getMinutes();
    const ap = h < 12 ? 'AM' : 'PM'; h = h % 12; if (h === 0) h = 12;
    return `${h}:${pad(mn)} ${ap}`;
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function startOfWeek() { const d = new Date(); d.setHours(0, 0, 0, 0); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.getTime(); } // Monday
  function startOfMonth() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
  function inFilter(ts, f) {
    if (f === 'all') return true;
    if (f === 'today') return dayKey(ts) === dayKey(Date.now());
    if (f === 'week') return ts >= startOfWeek();
    if (f === 'month') return ts >= startOfMonth();
    return true;
  }
  const debits = list => list.filter(e => !e.credit);
  const sum = list => list.reduce((a, e) => a + (Number(e.amount) || 0), 0);
  const monthSpend = () => sum(debits(S.expenses.filter(e => inFilter(e.ts, 'month'))));

  // ---------------- shell ----------------
  const screen = document.getElementById('screen');
  const nav = document.getElementById('nav');
  const overlay = document.getElementById('overlay');
  const toastEl = document.getElementById('toast');
  const ui = { tab: 'tap', entry: '', cat: null, credit: false, note: '', filter: 'today', period: 'month' };

  let toastT;
  function toast(msg, credit) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('credit', !!credit);
    toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }
  const vibrate = ms => { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } };

  function setTab(tab) { ui.tab = tab; render(); }
  function render() {
    const map = { tap: renderTap, history: renderHistory, analytics: renderAnalytics };
    screen.innerHTML = (map[ui.tab] || renderTap)();
    screen.scrollTop = 0;
    screen.firstElementChild && screen.firstElementChild.classList.add('fade');
    [...nav.children].forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
    if (ui.tab === 'tap') updateTap();
  }

  // ================= TAP =================
  function chip(c, selName) {
    return `<button class="chip ${c.n === selName ? 'sel' : ''}" data-act="cat" data-n="${c.n}">
      <span class="e">${c.e}</span>${esc(c.n)}</button>`;
  }
  function renderTap() {
    return `<div class="tap">
      <div class="tap-top">
        <div class="q">How much?</div>
        <div class="amount" id="amt"><span class="cur">₹</span><span class="val">0</span></div>
      </div>
      <div class="chips" id="chips">${CATS.map(c => chip(c, ui.cat)).join('')}</div>
      <div class="noterow">
        <input class="noteinput" id="noteInput" maxlength="60" placeholder="＋  Add note (e.g. KFC)" value="${esc(ui.note)}">
      </div>
      <div class="keypad-wrap">
        <div class="credit-toggle ${ui.credit ? 'on' : ''}" data-act="credit">
          <span>Credit</span><span class="sw"><i></i></span>
        </div>
        <div class="keypad">
          ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button class="key" data-act="key" data-k="${k}">${k}</button>`).join('')}
          <button class="key fn" data-act="key" data-k=".">.</button>
          <button class="key" data-act="key" data-k="0">0</button>
          <button class="key fn" data-act="back" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M20 5H8.5a2 2 0 0 0-1.5.7L2.5 11a1.4 1.4 0 0 0 0 2l4.5 5.3a2 2 0 0 0 1.5.7H20a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="M17 9l-6 6M11 9l6 6"/></svg></button>
        </div>
        <button class="save-btn" id="saveBtn" data-act="save">Save expense</button>
      </div>
    </div>`;
  }
  function updateTap() {
    const amt = document.getElementById('amt');
    const btn = document.getElementById('saveBtn');
    if (!amt || !btn) return;
    const v = parseFloat(ui.entry) || 0;
    amt.querySelector('.val').textContent = fmtEntry(ui.entry);
    amt.classList.toggle('credit', ui.credit);
    amt.classList.toggle('zero', v <= 0);
    btn.classList.toggle('credit', ui.credit);
    btn.disabled = !(v > 0 && ui.cat);
    btn.textContent = ui.credit ? 'Save credit' : 'Save expense';
  }
  function tapKey(k) {
    if (k === '.') { if (!ui.entry.includes('.')) ui.entry = (ui.entry || '0') + '.'; }
    else {
      if (ui.entry.includes('.')) { if (ui.entry.split('.')[1].length >= 2) return; }
      else if (ui.entry.replace('.', '').length >= 9) return;
      if (ui.entry === '0') ui.entry = '';
      ui.entry += k;
    }
    updateTap();
  }
  function tapBack() { ui.entry = ui.entry.slice(0, -1); updateTap(); vibrate(8); }
  function tapSave() {
    const v = parseFloat(ui.entry) || 0;
    if (!(v > 0) || !ui.cat) return;
    const noteEl = document.getElementById('noteInput');
    S.expenses.push({
      id: S.nextId++, amount: v, cat: ui.cat,
      note: (noteEl ? noteEl.value : ui.note).trim(),
      credit: !!ui.credit, ts: Date.now(),
    });
    save();
    const wasCredit = ui.credit;
    ui.entry = ''; ui.cat = null; ui.credit = false; ui.note = '';
    render();
    toast(wasCredit ? '✓ Credit saved' : '✓ Expense saved', wasCredit);
    vibrate(18);
  }

  // ================= HISTORY =================
  function renderHistory() {
    const list = S.expenses.filter(e => inFilter(e.ts, ui.filter)).sort((a, b) => b.ts - a.ts);
    const groups = {};
    for (const e of list) { (groups[dayKey(e.ts)] = groups[dayKey(e.ts)] || []).push(e); }
    const keys = Object.keys(groups).sort().reverse();

    const spent = monthSpend(); const bud = budget();
    const ratio = bud > 0 ? spent / bud : 0; const over = spent > bud;

    let body;
    if (list.length === 0) {
      body = `<div class="empty"><div class="em">🧾</div><div class="t">Nothing here yet</div>
        <div class="s">Tap the ＋ button below to record an expense.</div></div>`;
    } else {
      body = keys.map(k => {
        const items = groups[k];
        const dayTotal = items.reduce((a, e) => a + (e.credit ? 0 : Number(e.amount)), 0);
        return `<div class="daygroup">
          <div class="dayhead"><span class="d">${fmtDayHead(k)}</span><span class="t">${rupee(dayTotal)}</span></div>
          ${items.map(expRow).join('')}
        </div>`;
      }).join('');
    }

    return `<div class="screen-inner">
      <div class="pad">
        <div class="row-between">
          <h1 class="h-title">Expenses</h1>
          <button class="iconbtn" data-act="cyclefilter" title="Filter">
            <svg viewBox="0 0 24 24"><path d="M3 5h18"/><path d="M6 12h12"/><path d="M10 19h4"/></svg>
          </button>
        </div>
        <div class="filters">
          ${[['today', 'Today'], ['week', 'This Week'], ['month', 'This Month'], ['all', 'All']]
            .map(([f, l]) => `<button class="filter ${ui.filter === f ? 'sel' : ''}" data-act="filter" data-f="${f}">${l}</button>`).join('')}
        </div>
        ${body}
      </div>
      <div class="sticky-total" data-act="budget" title="Tap to edit budget">
        <div class="line">
          <span class="lbl">Total this month</span>
          <span class="v ${over ? 'over' : ''}">${rupee(spent)} <span class="of">of ${rupee(bud)}</span></span>
        </div>
        <div class="budgetbar"><i class="${over ? 'over' : ''}" style="width:${Math.min(100, ratio * 100)}%"></i></div>
      </div>
    </div>`;
  }
  function expRow(e) {
    const c = catOf(e.cat);
    return `<button class="exp" data-act="edit" data-id="${e.id}">
      <span class="circ" style="background:${c.c}22;color:${c.c}">${c.e}</span>
      <span class="mid">
        <span class="cn">${esc(c.n)}</span>
        ${e.note ? `<span class="nt">${esc(e.note)}</span>` : `<span class="nt" style="color:var(--faint)">No note</span>`}
      </span>
      <span class="right">
        <span class="amt ${e.credit ? 'credit' : ''}">${e.credit ? '+' : '−'}${rupee(e.amount)}</span>
        <span class="tm">${fmtTime(e.ts)}</span>
      </span>
    </button>`;
  }

  // ================= ANALYTICS =================
  function renderAnalytics() {
    const p = ui.period;
    const list = S.expenses.filter(e => inFilter(e.ts, p));
    const spent = sum(debits(list));
    const received = sum(list.filter(e => e.credit));
    const net = received - spent;
    const label = p === 'week' ? 'this week' : p === 'all' ? 'all time' : 'this month';

    // by category
    const byCat = {};
    for (const e of debits(list)) byCat[e.cat] = (byCat[e.cat] || 0) + Number(e.amount);
    const cats = Object.keys(byCat).map(n => ({ n, v: byCat[n] })).sort((a, b) => b.v - a.v);
    const catMax = Math.max(1, ...cats.map(c => c.v));

    // last 7 days trend
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
      const k = dayKey(d.getTime());
      const v = S.expenses.filter(e => !e.credit && dayKey(e.ts) === k).reduce((a, e) => a + Number(e.amount), 0);
      days.push({ l: WDS[d.getDay()], v });
    }
    const dMax = Math.max(1, ...days.map(d => d.v));

    // budget context (month view only)
    const bud = budget();
    let budgetCard = '';
    if (p === 'month') {
      const remain = bud - spent; const ratio = bud > 0 ? spent / bud : 0; const over = remain < 0;
      const now = new Date(); const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = daysInMonth - now.getDate();
      budgetCard = `<div class="card" style="margin-top:16px;cursor:pointer" data-act="budget">
        <div class="row-between"><span class="sec" style="margin:0">Monthly budget</span>
          <span style="font-size:13px;font-weight:800;color:${over ? 'var(--danger)' : 'var(--accent)'}">${Math.round(ratio * 100)}%</span></div>
        <div class="budgetbar" style="margin-top:12px"><i class="${over ? 'over' : ''}" style="width:${Math.min(100, ratio * 100)}%"></i></div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px">
          <span style="color:${over ? 'var(--danger)' : 'var(--credit)'};font-weight:700">${over ? rupee(-remain) + ' over' : rupee(remain) + ' left'}</span>
          <span style="color:var(--dim)">${daysLeft} day${daysLeft === 1 ? '' : 's'} left · tap to edit</span>
        </div>
      </div>`;
    }

    const count = debits(list).length;
    const avg = count ? spent / count : 0;

    return `<div class="pad">
      <h1 class="h-title">Analytics</h1>
      <p class="h-sub">Where your money goes</p>
      <div class="seg">
        ${[['week', 'Week'], ['month', 'Month'], ['all', 'All time']]
          .map(([v, l]) => `<button class="${p === v ? 'sel' : ''}" data-act="period" data-p="${v}">${l}</button>`).join('')}
      </div>

      <div class="bigstat">
        <div class="l">Spent ${label}</div>
        <div class="v">${rupee(spent)}</div>
        ${received > 0 ? `<div class="sub">Received <b class="ok">${rupee(received)}</b> · Net ${net >= 0 ? `<b class="ok">+${rupee(net)}</b>` : `<b class="bad">−${rupee(-net)}</b>`}</div>` : ''}
      </div>

      <div class="twostat">
        <div class="s"><div class="v">${count}</div><div class="l">Transactions</div></div>
        <div class="s"><div class="v">${rupee(avg)}</div><div class="l">Avg / expense</div></div>
      </div>

      ${budgetCard}

      <div class="sec">Last 7 days</div>
      <div class="card">
        <div class="chart">
          ${days.map((d, i) => `<div class="col"><div class="b ${i === days.length - 1 ? '' : 'dim'}" style="height:${Math.max(4, (d.v / dMax) * 108)}px" title="${rupee(d.v)}"></div></div>`).join('')}
        </div>
        <div class="chartx">${days.map(d => `<span>${d.l}</span>`).join('')}</div>
      </div>

      <div class="sec">By category</div>
      ${cats.length === 0
        ? `<div class="card"><div class="empty" style="padding:24px 8px"><div class="em">📊</div><div class="s" style="margin-top:8px">No spending ${label}.</div></div></div>`
        : `<div class="card">${cats.map(c => {
            const cc = catOf(c.n);
            return `<div class="catrow">
              <span class="circ" style="background:${cc.c}22;color:${cc.c}">${cc.e}</span>
              <span class="mid">
                <span class="top"><span class="n">${esc(cc.n)}</span><span class="a">${rupee(c.v)} · ${Math.round(c.v / spent * 100)}%</span></span>
                <span class="tr"><span class="fl" style="width:${(c.v / catMax) * 100}%;background:${cc.c}"></span></span>
              </span>
            </div>`;
          }).join('')}</div>`}
      <div style="height:8px"></div>
    </div>`;
  }

  // ================= EDIT SHEET =================
  let editState = null;
  function openEdit(id) {
    const e = S.expenses.find(x => x.id === id); if (!e) return;
    editState = { id: e.id, amount: e.amount, cat: e.cat, note: e.note || '', credit: !!e.credit };
    renderSheet();
    overlay.classList.add('show');
  }
  function renderSheet() {
    const es = editState;
    overlay.innerHTML = `<div class="sheet" data-stop>
      <div class="grabber"></div>
      <h3>Edit ${es.credit ? 'credit' : 'expense'}</h3>
      <p class="sub">Update the details or delete this entry.</p>
      <div class="field-lbl">Amount</div>
      <input class="input" id="editAmount" type="text" inputmode="decimal" value="${es.amount}">
      <div class="field-lbl">Category</div>
      <div class="chips-wrap" id="editChips">${CATS.map(c => chip(c, es.cat)).join('')}</div>
      <div class="field-lbl">Note</div>
      <input class="input" id="editNote" maxlength="60" placeholder="Add note" value="${esc(es.note)}">
      <div class="field-lbl">Type</div>
      <div class="credit-toggle inline ${es.credit ? 'on' : ''}" data-act="editcredit">
        <span>Mark as credit (money received)</span><span class="sw"><i></i></span>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-del" data-act="editdelete" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M6 6l1 14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-14"/></svg></button>
        <button class="btn btn-save" data-act="editsave">Save changes</button>
      </div>
    </div>`;
  }
  function closeSheet() { overlay.classList.remove('show'); overlay.innerHTML = ''; editState = null; }
  function editSave() {
    const amt = parseFloat(document.getElementById('editAmount').value) || 0;
    if (!(amt > 0)) { toast('Enter an amount'); return; }
    const e = S.expenses.find(x => x.id === editState.id); if (!e) return closeSheet();
    e.amount = amt; e.cat = editState.cat; e.credit = editState.credit;
    e.note = document.getElementById('editNote').value.trim();
    save(); closeSheet(); render(); toast('✓ Updated');
  }
  function editDelete() {
    S.expenses = S.expenses.filter(x => x.id !== editState.id);
    save(); closeSheet(); render(); toast('🗑 Deleted'); vibrate(18);
  }

  // ================= BUDGET SHEET =================
  function openBudget() {
    overlay.innerHTML = `<div class="sheet" data-stop>
      <div class="grabber"></div>
      <h3>Monthly budget</h3>
      <p class="sub">Set the target you want to stay under each month.</p>
      <div class="field-lbl">Budget amount (₹)</div>
      <input class="input" id="budgetInput" type="text" inputmode="numeric" value="${budget()}">
      <div class="sheet-actions">
        <button class="btn btn-save" data-act="budgetsave" style="flex:1">Save budget</button>
      </div>
    </div>`;
    overlay.classList.add('show');
  }
  function budgetSave() {
    const v = parseInt(String(document.getElementById('budgetInput').value).replace(/[^0-9]/g, ''), 10);
    if (!(v >= 0)) { toast('Enter a valid amount'); return; }
    S.settings.budget = v; save(); closeSheet(); render(); toast('✓ Budget updated');
  }

  // ================= events =================
  nav.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });

  screen.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (act === 'key') tapKey(el.dataset.k);
    else if (act === 'back') tapBack();
    else if (act === 'save') tapSave();
    else if (act === 'cat') { ui.cat = ui.cat === el.dataset.n ? null : el.dataset.n; syncChips('chips'); updateTap(); vibrate(6); }
    else if (act === 'credit') { ui.credit = !ui.credit; el.classList.toggle('on', ui.credit); updateTap(); }
    else if (act === 'filter') { ui.filter = el.dataset.f; render(); }
    else if (act === 'cyclefilter') { const order = ['today', 'week', 'month', 'all']; ui.filter = order[(order.indexOf(ui.filter) + 1) % order.length]; render(); }
    else if (act === 'edit') openEdit(Number(el.dataset.id));
    else if (act === 'budget') openBudget();
    else if (act === 'period') { ui.period = el.dataset.p; render(); }
  });
  screen.addEventListener('input', e => { if (e.target.id === 'noteInput') ui.note = e.target.value; });

  overlay.addEventListener('click', e => {
    if (!e.target.closest('[data-stop]')) { closeSheet(); return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (act === 'cat' && editState) { editState.cat = editState.cat === el.dataset.n ? null : el.dataset.n; syncChips('editChips', editState.cat); }
    else if (act === 'editcredit') { editState.credit = !editState.credit; el.classList.toggle('on', editState.credit); }
    else if (act === 'editsave') editSave();
    else if (act === 'editdelete') editDelete();
    else if (act === 'budgetsave') budgetSave();
  });

  function syncChips(containerId, selName) {
    const sel = selName !== undefined ? selName : ui.cat;
    const box = document.getElementById(containerId); if (!box) return;
    [...box.querySelectorAll('.chip')].forEach(c => c.classList.toggle('sel', c.dataset.n === sel));
  }

  // ---------------- boot ----------------
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
