<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A fast, offline expense tracker. Tap in what you spend, browse your history, and see where your money goes.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spend">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Spend</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0E0E0E;
    --surface-alt: #171717;
    --elev: #1E1E1E;
    --border: #262626;
    --text: #FFFFFF;
    --dim: #A1A1A1;
    --faint: #6B6B6B;
    --accent: #0A84FF;
    --accent-dim: rgba(10,132,255,.22);
    --on-accent: #FFFFFF;
    --credit: #32D74B;
    --danger: #FF453A;
    --track: #1C1C1C;
    --sys: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: #000; }
  body {
    margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none;
    font-family: var(--sys); color: var(--text); background: #000;
    -webkit-font-smoothing: antialiased;
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    touch-action: manipulation;
  }
  button, input, select { font-family: var(--sys); }
  input, select { -webkit-appearance: none; appearance: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    max-width: 520px; margin: 0 auto;
    background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  @media (max-width: 520px) { .app { border-left: none; border-right: none; } }

  .screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .screen-inner { flex: 1; display: flex; flex-direction: column; min-height: 100%; }
  .screen-inner .pad { flex: 1; }
  .pad { padding: calc(env(safe-area-inset-top) + 14px) 18px 20px; }
  .fade { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* nav */
  .nav { flex: none; display: flex; align-items: stretch; padding: 8px 8px calc(env(safe-area-inset-bottom) + 10px); background: #0A0A0A; border-top: 1px solid var(--border); }
  .nav button { flex: 1; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--faint); padding: 6px 0; transition: color .18s; }
  .nav button .lbl { font-size: 11px; font-weight: 700; }
  .nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav button.active { color: var(--accent); }
  .nav .tapbtn .ring { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface-alt); transition: background .18s, box-shadow .18s; margin-top: -2px; }
  .nav .tapbtn svg { width: 26px; height: 26px; }
  .nav .tapbtn.active .ring { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim), 0 8px 20px -6px rgba(10,132,255,.5); }
  .nav .tapbtn.active { color: var(--accent); }
  .nav .tapbtn.active .ring svg { stroke: var(--on-accent); }

  /* generic */
  .h-title { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .h-sub { color: var(--dim); font-size: 14px; margin: 4px 0 0; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .hrow-actions { display: flex; gap: 8px; }
  .iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .iconbtn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn:active { transform: scale(.95); }
  .iconbtn.on { border-color: var(--accent); color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  .empty { text-align: center; color: var(--dim); padding: 48px 20px; }
  .empty .em { font-size: 44px; }
  .empty .t { font-size: 16px; font-weight: 700; color: var(--text); margin-top: 10px; }
  .empty .s { font-size: 14px; margin-top: 4px; }
  .sec { color: var(--dim); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin: 26px 2px 12px; display: flex; justify-content: space-between; align-items: center; }

  /* TAP — stepped native-dialog flow */
  .flow { flex: 1; display: flex; flex-direction: column; }
  .flow-body { padding: calc(env(safe-area-inset-top) + 22px) 20px 0; }
  .flow-body.scroll { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .flow-body.scroll::-webkit-scrollbar { display: none; }
  .stepdots { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .stepdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: .25s; }
  .stepdots i.on { background: var(--accent); width: 20px; }
  .flow-title { font-size: 25px; font-weight: 800; text-align: center; letter-spacing: -.02em; margin: 0 0 20px; text-wrap: balance; }
  .amount-field { background: var(--surface-alt); border-radius: 16px; padding: 22px 18px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .amount-field .cur { font-size: 28px; font-weight: 700; color: var(--dim); }
  .amount-field .val { font-size: 46px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .amount-field.zero .val, .amount-field.zero .cur { color: var(--faint); }
  .amount-field.credit .val, .amount-field.credit .cur { color: var(--credit); }
  .flow-bottom { margin-top: auto; padding: 12px 14px 4px; }
  .flow-actions { display: flex; gap: 10px; margin-top: 12px; }
  .pill { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; transition: opacity .18s, transform .08s; }
  .pill:active { transform: scale(.99); }
  .pill.ghost { background: var(--surface-alt); color: var(--text); }
  .pill.blue { background: var(--accent); color: var(--on-accent); }
  .pill.blue:disabled { opacity: .4; cursor: default; }
  .cat-list { display: flex; flex-direction: column; background: var(--surface-alt); border-radius: 16px; overflow: hidden; }
  .cat-item { display: flex; align-items: center; gap: 14px; padding: 15px 16px; background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-size: 17px; font-weight: 600; cursor: pointer; text-align: left; width: 100%; }
  .cat-item:last-child { border-bottom: none; }
  .cat-item:active { background: var(--elev); }
  .cat-item .ci { font-size: 22px; width: 26px; text-align: center; flex: none; }
  .cat-item .cn { flex: 1; min-width: 0; }
  .cat-item.sel { color: var(--accent); }
  .cat-item .chk { color: var(--accent); font-weight: 800; font-size: 18px; }
  .flow-input { width: 100%; background: var(--surface-alt); border: none; border-radius: 16px; color: var(--text); font-size: 18px; padding: 18px; }
  .flow-input::placeholder { color: var(--faint); }
  .flow-recap { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--dim); font-size: 14px; margin-top: 18px; }
  .flow-recap b { color: var(--text); font-weight: 700; }
  .flow-recap .em { font-size: 18px; }

  .chips { display: flex; gap: 9px; overflow-x: auto; padding: 6px 18px 2px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; scroll-snap-align: start; display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1.5px solid var(--border); color: var(--dim); padding: 9px 15px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: border-color .16s, color .16s, background .16s; }
  .chip .e { font-size: 17px; }
  .chip.sel { border-color: var(--accent); color: var(--text); background: var(--surface-alt); box-shadow: 0 0 0 3px var(--accent-dim), 0 0 14px -2px rgba(10,132,255,.45); }

  .noterow { padding: 10px 18px 0; display: flex; gap: 8px; align-items: center; }
  .noteinput { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; padding: 12px 14px; }
  .noteinput::placeholder { color: var(--faint); }
  .notehint { color: var(--accent); font-size: 12px; font-weight: 600; padding: 6px 18px 0; height: 12px; opacity: 0; transition: opacity .2s; }
  .notehint.show { opacity: 1; }
  .clip { width: 46px; height: 46px; flex: none; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--dim); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
  .clip svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .clip.has { border-color: var(--accent); }
  .clip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .quickrow { display: flex; gap: 7px; overflow-x: auto; padding: 10px 18px 0; scrollbar-width: none; }
  .quickrow::-webkit-scrollbar { display: none; }
  .qchip { flex: none; background: var(--surface-alt); border: 1px solid var(--border); color: var(--dim); padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .qchip.amt { color: var(--text); font-variant-numeric: tabular-nums; }

  .keypad-wrap { margin-top: auto; padding: 10px 14px 0; }
  .method-row { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin: 4px 0 8px; }
  .mchip { background: var(--surface); border: 1.5px solid var(--border); color: var(--dim); padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; transition: .16s; }
  .mchip.sel { border-color: var(--accent); color: var(--text); background: var(--surface-alt); }
  .credit-toggle { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 auto 10px; background: var(--surface); border: 1.5px solid var(--border); color: var(--dim); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; width: fit-content; transition: .16s; }
  .credit-toggle .sw { width: 34px; height: 20px; border-radius: 999px; background: var(--border); position: relative; transition: background .18s; }
  .credit-toggle .sw i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--faint); transition: left .18s, background .18s; }
  .credit-toggle.on { border-color: var(--credit); color: var(--credit); background: rgba(50,215,75,.08); }
  .credit-toggle.on .sw { background: rgba(50,215,75,.35); }
  .credit-toggle.on .sw i { left: 16px; background: var(--credit); }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key { border: none; background: var(--surface-alt); color: var(--text); font-size: 25px; font-weight: 600; border-radius: 16px; padding: 14px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .12s, transform .08s; }
  .key:active { background: var(--elev); transform: scale(.97); }
  .key.fn { color: var(--dim); }
  .key svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .save-btn { width: 100%; margin-top: 10px; padding: 16px; border-radius: 16px; border: none; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .18s, transform .08s; }
  .save-btn:active { transform: scale(.99); }
  .save-btn.credit { background: var(--credit); color: #04220c; }
  .save-btn:disabled { opacity: .3; cursor: default; }

  /* HISTORY */
  .searchbox { margin-top: 14px; display: none; }
  .searchbox.show { display: block; }
  .searchbox input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; padding: 12px 14px; }
  .searchbox input::placeholder { color: var(--faint); }
  .filters { display: flex; gap: 8px; margin-top: 14px; }
  .filter { flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--dim); padding: 9px 4px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .16s; }
  .filter.sel { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .daygroup { margin-top: 22px; }
  .dayhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
  .dayhead .d { color: var(--dim); font-size: 12px; font-weight: 800; letter-spacing: .07em; }
  .dayhead .t { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .exp { display: flex; align-items: center; gap: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 12px 14px; margin-bottom: 9px; cursor: pointer; width: 100%; text-align: left; color: var(--text); transition: transform .1s, background .16s; }
  .exp:active { transform: scale(.99); background: var(--surface-alt); }
  .exp .circ { width: 42px; height: 42px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
  .exp .circ .rec { position: absolute; right: -2px; bottom: -2px; font-size: 10px; background: var(--surface); border-radius: 50%; }
  .exp .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .exp .cn { font-size: 15px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp .nt { color: var(--dim); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp .nt .mtag { color: var(--faint); }
  .exp .right { flex: none; padding-left: 6px; display: flex; flex-direction: column; align-items: flex-end; }
  .exp .amt { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
  .exp .amt.credit { color: var(--credit); }
  .exp .tm { color: var(--faint); font-size: 12px; margin-top: 3px; }
  .sticky-total { position: sticky; bottom: 0; margin-top: auto; background: rgba(10,10,10,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 13px 18px calc(env(safe-area-inset-bottom) + 4px); cursor: pointer; }
  .sticky-total .line { display: flex; align-items: baseline; justify-content: space-between; }
  .sticky-total .lbl { font-size: 13px; color: var(--dim); font-weight: 600; }
  .sticky-total .v { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sticky-total .v .of { color: var(--faint); font-weight: 600; }
  .sticky-total .v.over { color: var(--danger); }
  .budgetbar { height: 7px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 8px; }
  .budgetbar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s cubic-bezier(.4,0,.2,1); }
  .budgetbar i.over { background: var(--danger); }

  /* ANALYTICS */
  .seg { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-top: 16px; }
  .seg button { flex: 1; border: none; background: none; color: var(--dim); font-size: 13px; font-weight: 700; padding: 8px 4px; border-radius: 9px; cursor: pointer; transition: .16s; }
  .seg button.sel { background: var(--accent); color: var(--on-accent); }
  .bigstat { text-align: center; margin: 22px 0 6px; }
  .bigstat .l { color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .bigstat .v { font-size: 44px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .bigstat .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .bigstat .sub b.ok { color: var(--credit); } .bigstat .sub b.bad { color: var(--danger); }
  .twostat { display: flex; gap: 10px; margin-top: 16px; }
  .twostat .s { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; }
  .twostat .s .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .twostat .s .l { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .insight { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .insight:last-child { border-bottom: none; }
  .insight .ic { font-size: 20px; width: 26px; text-align: center; flex: none; }
  .insight .tx { flex: 1; font-size: 14px; color: var(--text); }
  .insight .tx b { font-weight: 800; }
  .insight .tx .m { color: var(--dim); font-size: 12px; margin-top: 1px; }
  .chart { display: flex; align-items: flex-end; gap: 7px; height: 130px; padding: 0 2px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart .col .b { width: 68%; min-width: 6px; border-radius: 7px 7px 3px 3px; background: var(--accent); transition: height .4s cubic-bezier(.4,0,.2,1); }
  .chart .col .b.dim { background: #10365e; }
  .chartx { display: flex; gap: 7px; margin-top: 8px; }
  .chartx span { flex: 1; text-align: center; color: var(--faint); font-size: 11px; font-weight: 600; }
  .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .heat .hd { text-align: center; color: var(--faint); font-size: 10px; font-weight: 700; }
  .heat .cell { aspect-ratio: 1; border-radius: 6px; background: var(--track); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .heat .cell.blank { background: transparent; }
  .heat .cell.today { outline: 1.5px solid var(--text); outline-offset: -1.5px; }
  .heatleg { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 10px; color: var(--faint); font-size: 11px; }
  .heatleg i { width: 12px; height: 12px; border-radius: 3px; }
  .catrow { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
  .catrow:last-child { margin-bottom: 0; }
  .catrow .circ { width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .catrow .mid { flex: 1; min-width: 0; }
  .catrow .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .catrow .top .n { font-size: 14px; font-weight: 700; }
  .catrow .top .a { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .catrow .top .a.over { color: var(--danger); }
  .catrow .tr { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .catrow .fl { height: 100%; border-radius: 999px; transition: width .45s ease; }
  .catrow .bl { font-size: 11px; color: var(--faint); margin-top: 4px; }

  /* overlay + sheet */
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 60; display: none; align-items: flex-end; }
  .overlay.show { display: flex; }
  .overlay.full-mode { align-items: stretch; background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .sheet { width: 100%; background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px; border-top: 1px solid var(--border); padding: 8px 18px calc(env(safe-area-inset-bottom) + 18px); max-height: 92%; overflow-y: auto; scrollbar-width: none; animation: slideup .28s cubic-bezier(.2,.8,.2,1); }
  .sheet::-webkit-scrollbar { display: none; }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  .grabber { width: 40px; height: 5px; border-radius: 999px; background: var(--border); margin: 8px auto 14px; }
  .sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .sheet-head .back { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; padding: 0 4px 0 0; line-height: 1; }
  .sheet h3 { font-size: 20px; font-weight: 800; margin: 0; }
  .sheet .sub { color: var(--dim); font-size: 13px; margin: 4px 0 16px; }
  .field-lbl { color: var(--dim); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 8px; }
  .field-lbl:first-of-type { margin-top: 6px; }
  .input { width: 100%; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 17px; padding: 13px 14px; font-variant-numeric: tabular-nums; }
  .input::placeholder { color: var(--faint); }
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips-wrap .chip, .chips-wrap .mchip { flex: none; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; }
  .btn:active { transform: scale(.99); }
  .btn-save { background: var(--accent); color: var(--on-accent); }

  /* settings list */

  .setrow .st { flex: 1; }
  .setrow .st .t { font-size: 15px; font-weight: 600; }
  .setrow .st .d { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .setrow .chev { color: var(--faint); font-size: 20px; }
  .listitem { display: flex; align-items: center; gap: 12px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; }
  .listitem .ci { width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .listitem .lt { flex: 1; min-width: 0; }
  .listitem .lt .n { font-size: 14px; font-weight: 700; }

  /* read-only expense detail view */
  .view-hero { text-align: center; margin: 6px 0 20px; }

  .lockline { display: flex; align-items: center; gap: 8px; justify-content: center; color: var(--faint); font-size: 13px; margin-top: 18px; text-align: center; line-height: 1.4; }

  /* lock */
  .lock { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 0 32px calc(env(safe-area-inset-bottom) + 20px); text-align: center; }

  .dots { display: flex; gap: 16px; margin-bottom: 34px; }

  .dots i.on { background: var(--accent); border-color: var(--accent); }

  .ob { padding: calc(env(safe-area-inset-top) + 40px) 26px calc(env(safe-area-inset-bottom) + 26px); display: flex; flex-direction: column; height: 100%; }

  .ob-feat .fi { font-size: 22px; width: 30px; text-align: center; flex: none; }
  .ob-feat .ft b { font-weight: 700; } .ob-feat .ft { font-size: 14px; }
  .ob-feat .ft .d { color: var(--dim); font-size: 13px; margin-top: 1px; }

  /* toast + undo */
  .toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translateX(-50%) translateY(14px); background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 14px; padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 70; box-shadow: 0 10px 30px -8px rgba(10,132,255,.45); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.credit { background: var(--credit); color: #04220c; }
  .undobar { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 90px); background: var(--elev); border: 1px solid var(--border); border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity .25s, transform .25s; z-index: 70; box-shadow: 0 14px 40px -12px #000; }
  .undobar.show { opacity: 1; transform: none; pointer-events: auto; }
  .undobar .ut { font-size: 14px; font-weight: 600; }
  .undobar .ub { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 800; cursor: pointer; padding: 4px 8px; }

  /* ---------- press feedback + tap ripple ---------- */
  /* Give every tappable element a springy press-in, and keep their existing
     colour transitions. Large primary buttons already have their own subtler
     :active, so they're left as-is. */
  .nav button, .chip, .cat-item, .filter, .seg button, .mchip, .qchip,
  .setrow, .listitem, .iconbtn, .swatch, .clip, .credit-toggle, .act, .addbtn, .ub {
    transition-property: transform, background, border-color, color, box-shadow, opacity;
    transition-duration: .13s; transition-timing-function: cubic-bezier(.4,0,.2,1);
  }
  .nav button:active, .chip:active, .cat-item:active, .filter:active, .seg button:active,
  .mchip:active, .qchip:active, .setrow:active, .listitem:active, .iconbtn:active,
  .swatch:active, .clip:active, .credit-toggle:active, .act:active, .addbtn:active { transform: scale(.93); }
  .nav .tapbtn:active { transform: none; }
  .nav .tapbtn:active .ring { transform: scale(.9); }

  .tap-ripple {
    position: fixed; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
    pointer-events: none; z-index: 300; transform: scale(0); opacity: .9;
    animation: tapRipple .5s ease-out forwards;
  }
  @keyframes tapRipple { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(9); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body>
<div class="app">
  <div class="screen" id="screen"></div>
  <nav class="nav" id="nav">
    <button data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-8 5"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>

  <input type="file" id="fileReceipt" accept="image/*" style="display:none">
</div>

<script>
(function () {
  'use strict';

  // ---------------- defaults ----------------
  const DEFAULT_CATS = [
    { n: 'Shopping',      e: '🛍️', c: '#FF6B9D' },
    { n: 'Entertainment', e: '🎬', c: '#A78BFA' },
    { n: 'Health',        e: '🍎', c: '#34D399' },
    { n: 'Junk food',     e: '🍕', c: '#FB923C' },
    { n: 'Vehicles',      e: '🚗', c: '#60A5FA' },
    { n: 'Fuel',          e: '⛽', c: '#FBBF24' },
    { n: 'Rent',          e: '🏠', c: '#F87171' },
    { n: 'Medicine',      e: '💊', c: '#22D3EE' },
    { n: 'Education',     e: '📚', c: '#818CF8' },
    { n: 'Other',         e: '🎁', c: '#9CA3AF' },
  ];
  const PALETTE = ['#FF6B9D','#A78BFA','#34D399','#FB923C','#60A5FA','#FBBF24','#F87171','#22D3EE','#818CF8','#9CA3AF','#F472B6','#4ADE80','#38BDF8','#FACC15','#C084FC'];
  const CURRENCIES = ['₹','$','€','£','¥','₩','₽','฿','د.إ','R'];

  function defaultState() {
    return {
      expenses: [], recurring: [],
      categories: DEFAULT_CATS.map(c => ({ ...c })),
      settings: { budget: 15000, currency: '₹', catBudgets: {}, methods: ['Cash', 'UPI', 'Card'], lockEnabled: false, pin: '', onboarded: false },
      nextId: 1,
    };
  }

  // ---------------- storage (+ migrate v1) ----------------
  const KEY = 'expenseTracker.v2';
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!S) { try { const old = JSON.parse(localStorage.getItem('expenseTracker.v1')); if (old) S = old; } catch (e) {} }
  if (!S) S = defaultState();
  // normalize shape
  const d = defaultState();
  S = Object.assign({}, d, S);
  S.settings = Object.assign({}, d.settings, S.settings || {});
  if (!Array.isArray(S.categories) || !S.categories.length) S.categories = d.categories;
  if (!Array.isArray(S.recurring)) S.recurring = [];
  if (!Array.isArray(S.expenses)) S.expenses = [];
  if (!S.settings.catBudgets) S.settings.catBudgets = {};
  if (!Array.isArray(S.settings.methods) || !S.settings.methods.length) S.settings.methods = ['Cash', 'UPI', 'Card'];
  if (!S.nextId) S.nextId = 1;
  // existing users with data shouldn't see onboarding
  if (S.expenses.length && !S.settings.onboarded) S.settings.onboarded = true;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }

  // ---------------- accessors ----------------
  const getCats = () => S.categories;
  const catOf = n => S.categories.find(c => c.n === n) || { n: n || 'Other', e: '🎁', c: '#9CA3AF' };
  const budget = () => Number(S.settings.budget) || 0;
  const cur = () => S.settings.currency || '₹';
  const methods = () => S.settings.methods;

  // ---------------- format ----------------
  const pad = n => (n < 10 ? '0' + n : '' + n);
  function fmtNum(n) {
    n = Number(n) || 0; const neg = n < 0; n = Math.abs(n);
    let i = Math.floor(n); const dec = Math.round((n - i) * 100);
    let s = String(i);
    if (s.length > 3) s = s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + s.slice(-3);
    if (dec > 0) s += '.' + pad(dec);
    return (neg ? '-' : '') + s;
  }
  const rupee = n => cur() + fmtNum(n);
  function fmtEntry(entry) {
    if (!entry) return '0';
    let [i, dd] = entry.split('.'); i = i || '0';
    let gi = i; if (i.length > 3) gi = i.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + i.slice(-3);
    return dd !== undefined ? gi + '.' + dd : gi;
  }
  const WD = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const MO = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const MOF = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WDS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dayKey = ts => { const x = new Date(ts); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
  const monthKey = ts => { const x = new Date(ts); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; };
  const daysIn = (y, m0) => new Date(y, m0 + 1, 0).getDate();
  function fmtDayHead(key) {
    const [y, m, dd] = key.split('-').map(Number); const dt = new Date(y, m - 1, dd);
    if (key === dayKey(Date.now())) return 'TODAY · ' + MO[m - 1] + ' ' + dd;
    return `${WD[dt.getDay()]}, ${MO[m - 1]} ${dd}`;
  }
  function fmtTime(ts) { const x = new Date(ts); let h = x.getHours(); const mn = x.getMinutes(); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; return `${h}:${pad(mn)} ${ap}`; }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function startOfWeek() { const x = new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.getTime(); }
  function startOfMonth() { const x = new Date(); return new Date(x.getFullYear(), x.getMonth(), 1).getTime(); }
  function inFilter(ts, f) {
    if (f === 'all') return true;
    if (f === 'today') return dayKey(ts) === dayKey(Date.now());
    if (f === 'week') return ts >= startOfWeek();
    if (f === 'month') return ts >= startOfMonth();
    return true;
  }
  const debits = list => list.filter(e => !e.credit);
  const sum = list => list.reduce((a, e) => a + (Number(e.amount) || 0), 0);
  const monthSpend = () => sum(debits(S.expenses.filter(e => monthKey(e.ts) === monthKey(Date.now()))));

  // ---------------- category auto-detect ----------------
  const KEYWORDS = {
    Fuel: ['petrol','diesel','fuel','cng','filling','bunk','indian oil','bharat petroleum'],
    Medicine: ['medicine','medicines','pharmacy','chemist','tablet','pills','doctor','hospital','clinic','medical','prescription','apollo','1mg','netmeds','pharmeasy','syrup','injection','dose'],
    'Junk food': ['kfc','mcdonald','mcd','burger','pizza','domino','zomato','swiggy','fries','coke','pepsi','cola','ice cream','icecream','chocolate','candy','snack','coffee','starbucks','cafe','chai','samosa','biryani','noodles','maggi','donut','cake','sweets','mithai','subway','dessert','fast food'],
    Entertainment: ['movie','cinema','netflix','prime video','hotstar','spotify','youtube','game','gaming','concert','pvr','inox','bookmyshow','disney','ott','music','theatre','theater','subscription','party','club'],
    Education: ['book','course','tuition','class','coaching','college','school','fees','fee ','udemy','coursera','exam','stationery','notebook','university','semester','library'],
    Vehicles: ['uber','ola','taxi','cab','rickshaw','auto ','metro','bus','train','ticket','parking','toll','rapido','car ','bike','service','tyre','repair','flight','indigo','airport','travel'],
    Rent: ['rent','pg ','hostel','lease','landlord','maintenance','deposit'],
    Shopping: ['amazon','flipkart','myntra','clothes','shirt','shoes','dress','mall','shopping','ajio','meesho','gadget','laptop','headphone','watch','bag','jeans','jacket','cosmetics','makeup','nykaa','electronics','store'],
    Health: ['gym','fitness','protein','yoga','salad','fruit','vegetable','veggies','workout','supplement','organic','juice','smoothie','spa','massage','grocery','groceries'],
  };
  const GUESS_ORDER = ['Fuel','Medicine','Junk food','Entertainment','Education','Vehicles','Rent','Shopping','Health'];
  function guessCategory(text) {
    const t = String(text || '').toLowerCase(); if (!t.trim()) return null;
    const have = new Set(S.categories.map(c => c.n));
    for (const cat of GUESS_ORDER) { if (!have.has(cat)) continue; for (const w of KEYWORDS[cat]) if (t.includes(w)) return cat; }
    return null;
  }

  // ---------------- recurring auto-post ----------------
  function postDueRecurring() {
    const now = new Date(); const mk = monthKey(now.getTime()); let posted = 0;
    for (const r of S.recurring) {
      if (!r.active) continue;
      if (r.lastPosted === mk) continue;
      const dim = daysIn(now.getFullYear(), now.getMonth());
      const day = Math.min(r.dayOfMonth || 1, dim);
      if (now.getDate() >= day) {
        const ts = new Date(now.getFullYear(), now.getMonth(), day, 9, 0).getTime();
        S.expenses.push({ id: S.nextId++, amount: r.amount, cat: r.cat, note: r.note || '', credit: !!r.credit, method: r.method || methods()[0], ts, recurringId: r.id });
        r.lastPosted = mk; posted++;
      }
    }
    if (posted) save();
    return posted;
  }

  // ---------------- shell ----------------
  const screen = document.getElementById('screen');
  const nav = document.getElementById('nav');
  const overlay = document.getElementById('overlay');
  const toastEl = document.getElementById('toast');
  const undobar = document.getElementById('undobar');
  const undotext = document.getElementById('undotext');
  const fileImport = document.getElementById('fileImport');
  const fileReceipt = document.getElementById('fileReceipt');
  const ui = { tab: 'tap', step: 1, entry: '', cat: null, credit: false, note: '', method: methods()[0], receipt: null, filter: 'today', search: '', searchOpen: false, period: 'month' };

  let toastT; function toast(msg, credit) { toastEl.textContent = msg; toastEl.classList.toggle('credit', !!credit); toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1400); }
  const vibrate = ms => { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } };

  function setTab(tab) { ui.tab = tab; render(); }
  function render() {
    const map = { tap: renderTap, history: renderHistory, analytics: renderAnalytics };
    screen.innerHTML = (map[ui.tab] || renderTap)();
    screen.scrollTop = 0;
    screen.firstElementChild && screen.firstElementChild.classList.add('fade');
    [...nav.children].forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
    if (ui.tab === 'tap') updateTap();
  }

  // ================= TAP =================
  function catChips(sel, act) { return getCats().map(c => `<button class="chip ${c.n === sel ? 'sel' : ''}" data-act="${act}" data-n="${esc(c.n)}"><span class="e">${c.e}</span>${esc(c.n)}</button>`).join(''); }
  function methodChips(sel, act) { return methods().map(m => `<button class="mchip ${m === sel ? 'sel' : ''}" data-act="${act}" data-m="${esc(m)}">${esc(m)}</button>`).join(''); }
  function recentNotes() { const seen = new Set(); const out = []; const sorted = [...S.expenses].sort((a, b) => b.ts - a.ts); for (const e of sorted) { const n = (e.note || '').trim(); if (n && !seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); out.push(n); } if (out.length >= 5) break; } return out; }
  function frequentAmounts() { const cnt = {}; for (const e of debits(S.expenses)) cnt[e.amount] = (cnt[e.amount] || 0) + 1; const arr = Object.keys(cnt).map(Number).sort((a, b) => cnt[b] - cnt[a]); const top = arr.slice(0, 4); return top.length ? top : [100, 200, 500]; }

  // Three-step flow modelled on the iOS Shortcuts dialogs:
  //   1 amount → 2 choose a category → 3 add a note (+ credit / method / receipt)
  function dots(step) { return `<div class="stepdots">${[1, 2, 3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`; }
  function renderTap() {
    if (ui.method == null || !methods().includes(ui.method)) ui.method = methods()[0];
    if (!ui.step) ui.step = 1;
    if (ui.step === 2) return renderTapCat();
    if (ui.step === 3) return renderTapNote();
    return renderTapAmount();
  }
  function renderTapAmount() {
    const amts = frequentAmounts();
    return `<div class="flow">
      <div class="flow-body">
        ${dots(1)}
        <div class="flow-title">How much did you spend?</div>
        <div class="amount-field zero" id="amt"><span class="cur">${esc(cur())}</span><span class="val">0</span></div>
        <div class="quickrow" style="justify-content:center;padding:14px 0 0">${amts.map(a => `<button class="qchip amt" data-act="qamt" data-a="${a}">${esc(cur())}${fmtNum(a)}</button>`).join('')}</div>
      </div>
      <div class="flow-bottom">
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(k => `<button class="key" data-act="key" data-k="${k}">${k}</button>`).join('')}
          <button class="key fn" data-act="key" data-k=".">.</button>
          <button class="key" data-act="key" data-k="0">0</button>

        <div style="height:12px"></div>

    const c = catOf(ui.cat); const notes = recentNotes();
    return `<div class="flow">
      <div class="flow-body scroll">
        ${dots(3)}
        <div class="flow-title">Add a note <span style="color:var(--faint);font-weight:600">(optional)</span></div>
        <input class="flow-input" id="noteInput" maxlength="60" placeholder="Note" value="${esc(ui.note)}">
        ${notes.length ? `<div class="quickrow" style="padding:12px 0 0">${notes.map(n => `<button class="qchip" data-act="qnote" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
        <div class="flow-recap"><span class="em">${c.e}</span><b>${esc(c.n)}</b> · <b>${ui.credit ? '+' : ''}${rupee(parseFloat(ui.entry) || 0)}</b></div>
        <div style="margin-top:18px" class="method-row">${methods().length > 1 ? methodChips(ui.method, 'method') : ''}</div>
        <div class="credit-toggle ${ui.credit ? 'on' : ''}" data-act="credit" style="margin:14px auto 0"><span>Credit (money received)</span><span class="sw"><i></i></span></div>
        <div style="display:flex;justify-content:center;margin-top:14px">
          <button class="clip ${ui.receipt ? 'has' : ''}" data-act="receipt" aria-label="Attach receipt" style="width:auto;padding:9px 16px;gap:8px;border-radius:999px;font-size:13px;font-weight:700;color:${ui.receipt ? 'var(--accent)' : 'var(--dim)'}">${ui.receipt ? '📎 Receipt attached' : '📎 Attach receipt'}</button>
        </div>
      </div>

  }
  function updateTap() {
    if (ui.step !== 1) return;
    const amt = document.getElementById('amt'), btn = document.getElementById('nextBtn'); if (!amt) return;
    const v = parseFloat(ui.entry) || 0;
    amt.querySelector('.val').textContent = fmtEntry(ui.entry);
    amt.classList.toggle('credit', ui.credit); amt.classList.toggle('zero', v <= 0);
    if (btn) btn.disabled = !(v > 0);
  }
  function tapKey(k) {
    if (k === '.') { if (!ui.entry.includes('.')) ui.entry = (ui.entry || '0') + '.'; }
    else { if (ui.entry.includes('.')) { if (ui.entry.split('.')[1].length >= 2) return; } else if (ui.entry.replace('.', '').length >= 9) return; if (ui.entry === '0') ui.entry = ''; ui.entry += k; }
    updateTap();
  }
  function resetDraft() { ui.entry = ''; ui.cat = null; ui.credit = false; ui.note = ''; ui.receipt = null; ui.step = 1; }
  function tapSave() {
    const v = parseFloat(ui.entry) || 0; if (!(v > 0) || !ui.cat) { toast('Add an amount & category'); return; }
    const noteEl = document.getElementById('noteInput');
    const exp = { id: S.nextId++, amount: v, cat: ui.cat, note: (noteEl ? noteEl.value : ui.note).trim(), credit: !!ui.credit, method: ui.method || methods()[0], ts: Date.now() };
    if (ui.receipt) exp.receipt = ui.receipt;
    S.expenses.push(exp);
    if (!save()) { S.expenses.pop(); S.nextId--; toast('Storage full — remove a receipt'); return; }
    const wasCredit = ui.credit;
    resetDraft();
    render(); toast(wasCredit ? '✓ Credit saved' : '✓ Expense saved', wasCredit); vibrate(18);
  }

  // ================= HISTORY =================
  function matchSearch(e, q) { if (!q) return true; q = q.toLowerCase(); return (e.note || '').toLowerCase().includes(q) || catOf(e.cat).n.toLowerCase().includes(q) || (e.method || '').toLowerCase().includes(q); }
  function renderHistory() {
    // When searching, span all dates (ignore the date pill); otherwise honor it.
    const list = S.expenses.filter(e => (ui.search ? true : inFilter(e.ts, ui.filter)) && matchSearch(e, ui.search)).sort((a, b) => b.ts - a.ts);
    const groups = {}; for (const e of list) (groups[dayKey(e.ts)] = groups[dayKey(e.ts)] || []).push(e);
    const keys = Object.keys(groups).sort().reverse();
    const spent = monthSpend(), bud = budget(), ratio = bud > 0 ? spent / bud : 0, over = spent > bud;
    let body;
    if (list.length === 0) {
      body = ui.search
        ? `<div class="empty"><div class="em">🔍</div><div class="t">No matches</div><div class="s">Nothing found for “${esc(ui.search)}”.</div></div>`
        : `<div class="empty"><div class="em">🧾</div><div class="t">Nothing here yet</div><div class="s">Tap the ＋ button below to record an expense.</div></div>`;
    } else {
      body = keys.map(k => { const items = groups[k]; const dayTotal = items.reduce((a, e) => a + (e.credit ? 0 : Number(e.amount)), 0);
        return `<div class="daygroup"><div class="dayhead"><span class="d">${fmtDayHead(k)}</span><span class="t">${rupee(dayTotal)}</span></div>${items.map(expRow).join('')}</div>`; }).join('');
    }
    return `<div class="screen-inner"><div class="pad">
      <div class="row-between">
        <h1 class="h-title">Expenses</h1>
        <div class="hrow-actions">
          <button class="iconbtn ${ui.searchOpen ? 'on' : ''}" data-act="togglesearch" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
          <button class="iconbtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15H4.5a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 6 8.6l-.33-.02a2 2 0 1 1 2.83-2.85l.06.06A1.65 1.65 0 0 0 11 4.6V4.5a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 18 6.6l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 12v.09a1.65 1.65 0 0 0 1.6 1.41"/></svg></button>
        </div>
      </div>
      <div class="searchbox ${ui.searchOpen ? 'show' : ''}"><input id="searchInput" placeholder="Search notes, categories…" value="${esc(ui.search)}"></div>
      <div class="filters">${[['today','Today'],['week','This Week'],['month','This Month'],['all','All']].map(([f, l]) => `<button class="filter ${ui.filter === f ? 'sel' : ''}" data-act="filter" data-f="${f}">${l}</button>`).join('')}</div>
      ${body}
      </div>
      <div class="sticky-total" data-act="settings" title="Budgets"><div class="line"><span class="lbl">Total this month</span><span class="v ${over ? 'over' : ''}">${rupee(spent)} <span class="of">of ${rupee(bud)}</span></span></div><div class="budgetbar"><i class="${over ? 'over' : ''}" style="width:${Math.min(100, ratio * 100)}%"></i></div></div>
    </div>`;
  }
  function expRow(e) {
    const c = catOf(e.cat);
    const sub = [e.note || '', (e.method && e.method !== 'Cash' ? e.method : (e.note ? '' : 'No note'))].filter(Boolean).join(' · ');
    return `<button class="exp" data-act="view" data-id="${e.id}">
      <span class="circ" style="background:${c.c}22;color:${c.c}">${c.e}${e.recurringId ? `<span class="rec">🔁</span>` : e.viaShortcut ? `<span class="rec">⚡</span>` : ''}${e.receipt ? `<span class="rec">📎</span>` : ''}</span>
      <span class="mid"><span class="cn">${esc(c.n)}</span><span class="nt">${esc(sub)}</span></span>
      <span class="right"><span class="amt ${e.credit ? 'credit' : ''}">${e.credit ? '+' : '−'}${rupee(e.amount)}</span><span class="tm">${fmtTime(e.ts)}</span></span>

  // ================= ANALYTICS =================
  function renderAnalytics() {
    const p = ui.period;
    const list = S.expenses.filter(e => inFilter(e.ts, p));
    const spent = sum(debits(list)), received = sum(list.filter(e => e.credit)), net = received - spent;
    const label = p === 'week' ? 'this week' : p === 'all' ? 'all time' : 'this month';
    const count = debits(list).length, avg = count ? spent / count : 0;

    // by category (with per-cat budgets in month view)
    const byCat = {}; for (const e of debits(list)) byCat[e.cat] = (byCat[e.cat] || 0) + Number(e.amount);
    const catsArr = Object.keys(byCat).map(n => ({ n, v: byCat[n] })).sort((a, b) => b.v - a.v);
    const catMax = Math.max(1, ...catsArr.map(c => c.v));

    // by method
    const byM = {}; for (const e of debits(list)) { const m = e.method || 'Cash'; byM[m] = (byM[m] || 0) + Number(e.amount); }
    const mArr = Object.keys(byM).map(n => ({ n, v: byM[n] })).sort((a, b) => b.v - a.v);

    // last 7 days
    const days = []; for (let i = 6; i >= 0; i--) { const x = new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate() - i); const k = dayKey(x.getTime()); const v = S.expenses.filter(e => !e.credit && dayKey(e.ts) === k).reduce((a, e) => a + Number(e.amount), 0); days.push({ l: WDS[x.getDay()], v }); }
    const dMax = Math.max(1, ...days.map(x => x.v));

    // last 6 months
    const mByKey = {}; for (const e of debits(S.expenses)) mByKey[monthKey(e.ts)] = (mByKey[monthKey(e.ts)] || 0) + Number(e.amount);
    const mons = []; const nowd = new Date(); for (let i = 5; i >= 0; i--) { const x = new Date(nowd.getFullYear(), nowd.getMonth() - i, 1); const k = `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; mons.push({ l: MOF[x.getMonth()].slice(0, 3), v: mByKey[k] || 0 }); }
    const monMax = Math.max(1, ...mons.map(x => x.v));

    // insights
    const now = new Date(); const thisMk = monthKey(now.getTime()); const lastMk = `${now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear()}-${pad(now.getMonth() === 0 ? 12 : now.getMonth())}`;
    const thisMonthSpend = mByKey[thisMk] || 0, lastMonthSpend = mByKey[lastMk] || 0;
    const dim = daysIn(now.getFullYear(), now.getMonth());
    const projected = now.getDate() > 0 ? Math.round(thisMonthSpend / now.getDate() * dim) : 0;
    let biggest = null; for (const e of debits(list)) if (!biggest || e.amount > biggest.amount) biggest = e;
    const insights = [];
    if (lastMonthSpend > 0) { const pc = Math.round((thisMonthSpend - lastMonthSpend) / lastMonthSpend * 100); insights.push({ ic: pc > 0 ? '📈' : '📉', t: `<b>${Math.abs(pc)}% ${pc >= 0 ? 'more' : 'less'}</b> than last month`, m: `${rupee(thisMonthSpend)} vs ${rupee(lastMonthSpend)}` }); }
    if (p === 'month' && thisMonthSpend > 0) insights.push({ ic: '🎯', t: `On pace for <b>${rupee(projected)}</b> this month`, m: `${rupee(thisMonthSpend)} spent over ${now.getDate()} day${now.getDate() === 1 ? '' : 's'}` });
    if (biggest) insights.push({ ic: catOf(biggest.cat).e, t: `Biggest: <b>${rupee(biggest.amount)}</b> on ${esc(catOf(biggest.cat).n)}`, m: biggest.note ? esc(biggest.note) : `${label}` });

    // budget card (month)
    const bud = budget(); let budgetCard = '';
    if (p === 'month') { const remain = bud - spent, ratio = bud > 0 ? spent / bud : 0, over = remain < 0, daysLeft = dim - now.getDate();
      budgetCard = `<div class="card" style="margin-top:16px;cursor:pointer" data-act="settings">
        <div class="row-between"><span class="sec" style="margin:0">Monthly budget</span><span style="font-size:13px;font-weight:800;color:${over ? 'var(--danger)' : 'var(--accent)'}">${Math.round(ratio * 100)}%</span></div>
        <div class="budgetbar" style="margin-top:12px"><i class="${over ? 'over' : ''}" style="width:${Math.min(100, ratio * 100)}%"></i></div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px"><span style="color:${over ? 'var(--danger)' : 'var(--credit)'};font-weight:700">${over ? rupee(-remain) + ' over' : rupee(remain) + ' left'}</span><span style="color:var(--dim)">${daysLeft} day${daysLeft === 1 ? '' : 's'} left · tap to edit</span></div></div>`; }

    // heatmap (this month)
    const hmY = now.getFullYear(), hmM = now.getMonth(), hmDays = daysIn(hmY, hmM), firstWd = new Date(hmY, hmM, 1).getDay();
    const daySpend = {}; for (const e of debits(S.expenses)) if (monthKey(e.ts) === thisMk) daySpend[new Date(e.ts).getDate()] = (daySpend[new Date(e.ts).getDate()] || 0) + Number(e.amount);
    const hmMax = Math.max(1, ...Object.values(daySpend));
    let cells = ''; for (let i = 0; i < firstWd; i++) cells += `<div class="cell blank"></div>`;
    for (let dd = 1; dd <= hmDays; dd++) { const v = daySpend[dd] || 0; const intensity = v > 0 ? 0.22 + (v / hmMax) * 0.78 : 0; const bg = v > 0 ? `rgba(10,132,255,${intensity.toFixed(2)})` : 'var(--track)'; const isToday = dd === now.getDate(); const col = intensity > 0.5 ? '#fff' : 'var(--faint)'; cells += `<div class="cell ${isToday ? 'today' : ''}" style="background:${bg};color:${col}">${dd}</div>`; }

    return `<div class="pad">
      <div class="row-between"><div><h1 class="h-title">Analytics</h1><p class="h-sub">Where your money goes</p></div>
        <button class="iconbtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15H4.5a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 6 8.6l-.33-.02a2 2 0 1 1 2.83-2.85l.06.06A1.65 1.65 0 0 0 11 4.6V4.5a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 18 6.6l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 12v.09a1.65 1.65 0 0 0 1.6 1.41"/></svg></button>
      </div>
      <div class="seg">${[['week','Week'],['month','Month'],['all','All time']].map(([v, l]) => `<button class="${p === v ? 'sel' : ''}" data-act="period" data-p="${v}">${l}</button>`).join('')}</div>
      <div class="bigstat"><div class="l">Spent ${label}</div><div class="v">${rupee(spent)}</div>${received > 0 ? `<div class="sub">Received <b class="ok">${rupee(received)}</b> · Net ${net >= 0 ? `<b class="ok">+${rupee(net)}</b>` : `<b class="bad">−${rupee(-net)}</b>`}</div>` : ''}</div>
      <div class="twostat"><div class="s"><div class="v">${count}</div><div class="l">Transactions</div></div><div class="s"><div class="v">${rupee(avg)}</div><div class="l">Avg / expense</div></div></div>
      ${budgetCard}
      ${insights.length ? `<div class="sec">Insights</div><div class="card">${insights.map(i => `<div class="insight"><span class="ic">${i.ic}</span><span class="tx">${i.t}<div class="m">${i.m}</div></span></div>`).join('')}</div>` : ''}
      <div class="sec">Last 7 days</div><div class="card"><div class="chart">${days.map((x, i) => `<div class="col"><div class="b ${i === days.length - 1 ? '' : 'dim'}" style="height:${Math.max(4, (x.v / dMax) * 108)}px" title="${rupee(x.v)}"></div></div>`).join('')}</div><div class="chartx">${days.map(x => `<span>${x.l}</span>`).join('')}</div></div>
      <div class="sec">Last 6 months</div><div class="card"><div class="chart">${mons.map((x, i) => `<div class="col"><div class="b ${i === mons.length - 1 ? '' : 'dim'}" style="height:${Math.max(4, (x.v / monMax) * 108)}px" title="${rupee(x.v)}"></div></div>`).join('')}</div><div class="chartx">${mons.map(x => `<span>${x.l}</span>`).join('')}</div></div>
      <div class="sec">${MOF[hmM]} heatmap</div><div class="card"><div class="heat">${WDS.map(w => `<div class="hd">${w[0]}</div>`).join('')}${cells}</div><div class="heatleg">Less <i style="background:var(--track)"></i><i style="background:rgba(10,132,255,.4)"></i><i style="background:rgba(10,132,255,.7)"></i><i style="background:rgba(10,132,255,1)"></i> More</div></div>
      <div class="sec">By category</div>
      ${catsArr.length === 0 ? `<div class="card"><div class="empty" style="padding:24px 8px"><div class="em">📊</div><div class="s" style="margin-top:8px">No spending ${label}.</div></div></div>`
        : `<div class="card">${catsArr.map(c => { const cc = catOf(c.n); const cb = (p === 'month') ? (Number(S.settings.catBudgets[c.n]) || 0) : 0; const cover = cb > 0 && c.v > cb;
            return `<div class="catrow"><span class="circ" style="background:${cc.c}22;color:${cc.c}">${cc.e}</span><span class="mid"><span class="top"><span class="n">${esc(cc.n)}</span><span class="a ${cover ? 'over' : ''}">${rupee(c.v)} · ${Math.round(c.v / spent * 100)}%</span></span><span class="tr"><span class="fl" style="width:${(c.v / catMax) * 100}%;background:${cover ? 'var(--danger)' : cc.c}"></span></span>${cb > 0 ? `<div class="bl">${cover ? rupee(c.v - cb) + ' over' : rupee(cb - c.v) + ' left'} of ${rupee(cb)} budget</div>` : ''}</span></div>`; }).join('')}</div>`}
      ${mArr.length ? `<div class="sec">By payment method</div><div class="card">${mArr.map(m => `<div class="catrow"><span class="mid"><span class="top"><span class="n">${esc(m.n)}</span><span class="a">${rupee(m.v)} · ${Math.round(m.v / spent * 100)}%</span></span><span class="tr"><span class="fl" style="width:${(m.v / Math.max(1, ...mArr.map(z => z.v))) * 100}%;background:var(--accent)"></span></span></span></div>`).join('')}</div>` : ''}
      <div style="height:10px"></div>
    </div>`;
  }

  // ================= EDIT SHEET =================
  let viewState = null;
  // Saved expenses are permanent: tapping a row opens a read-only detail
  // view — no editing, no deleting (the only global reset is Settings →
  // Reset all data, or restoring a backup).
  function openView(id) { const e = S.expenses.find(x => x.id === id); if (!e) return; viewState = e; renderView(); }
  function fmtFullDate(ts) { const d = new Date(ts); return `${MOF[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} · ${fmtTime(ts)}`; }
  function renderView() {
    const e = viewState; const c = catOf(e.cat);
    const row = (label, val) => `<div class="viewrow"><span>${label}</span><b>${val}</b></div>`;
    showSheet(`<div class="grabber"></div>
      <div class="view-hero">
        <div class="view-circ" style="background:${c.c}22;color:${c.c}">${c.e}</div>
        <div class="view-amt" style="color:${e.credit ? 'var(--credit)' : 'var(--text)'}">${e.credit ? '+' : '−'}${rupee(e.amount)}</div>
        <div class="view-cat">${esc(c.n)}</div>
      </div>
      ${row('Note', e.note ? esc(e.note) : '—')}
      ${row('Type', e.credit ? 'Credit · money received' : 'Expense · money spent')}
      ${row('Payment', esc(e.method || '—'))}
      ${row('Date', fmtFullDate(e.ts))}
      ${e.recurringId ? row('Source', '🔁 Recurring') : e.viaShortcut ? row('Source', '⚡ Back Tap shortcut') : ''}
      ${e.receipt ? `<div class="field-lbl">Receipt</div><img class="receipt-thumb" src="${e.receipt}" data-act="viewreceipt" alt="Receipt">` : ''}
      <div class="lockline">🔒 Saved entries are locked — they can't be edited or deleted.</div>
      <div class="sheet-actions"><button class="btn btn-save" data-act="closeview">Done</button></div>`);
  }

  // ================= UNDO =================
  let undoData = null, undoT;
  function showUndo(msg, exp) { undoData = exp; undotext.textContent = msg; undobar.classList.add('show'); clearTimeout(undoT); undoT = setTimeout(() => { undobar.classList.remove('show'); undoData = null; }, 5000); }
  function doUndo() { if (!undoData) return; S.expenses.push(undoData); save(); undoData = null; undobar.classList.remove('show'); render(); toast('↩ Restored'); }

  // ================= SETTINGS =================
  let ov = null;
  function openSettings() { ov = { view: 'home' }; renderOverlay(); }
  function renderOverlay() {
    const v = ov.view;
    if (v === 'home') return showSheet(settingsHome());
    if (v === 'budgets') return showSheet(budgetsView());
    if (v === 'cats') return showSheet(catsView());
    if (v === 'catEdit') return showSheet(catEditView());
    if (v === 'methods') return showSheet(methodsView());
    if (v === 'recurring') return showSheet(recurringView());
    if (v === 'recEdit') return showSheet(recEditView());
    if (v === 'currency') return showSheet(currencyView());
    if (v === 'pin') return showSheet(pinView());
    if (v === 'shortcut') return showSheet(shortcutView());
    if (v === 'about') return showSheet(aboutView());

      <div class="dots">${[0,1,2,3].map(i => `<i class="${i < lockEntry.length ? 'on' : ''}"></i>`).join('')}</div>

  function lockKey(k) {

  // ================= backup =================
  function copyText(t) { try { navigator.clipboard.writeText(t).then(() => toast('✓ Copied'), () => fallbackCopy(t)); } catch (e) { fallbackCopy(t); } }
  function fallbackCopy(t) { try { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('✓ Copied'); } catch (e) { toast('Copy failed'); } }
  function exportJSON() {
    const blob = new Blob([JSON.stringify({ app: 'spend', version: 2, exportedAt: new Date().toISOString(), state: S }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `spend-backup-${dayKey(Date.now())}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); toast('✓ Backup downloaded');
  }
  function exportCSV() {
    const rows = [['Date','Time','Type','Category','Note','Method','Amount']];
    for (const e of [...S.expenses].sort((a, b) => a.ts - b.ts)) { const dt = new Date(e.ts); rows.push([dayKey(e.ts), fmtTime(e.ts), e.credit ? 'Credit' : 'Debit', catOf(e.cat).n, (e.note || '').replace(/"/g, '""'), e.method || '', e.amount]); }
    const csv = rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${c}"` : c).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `spend-${dayKey(Date.now())}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); toast('✓ CSV downloaded');
  }
  fileImport.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0]; if (!file) return; const r = new FileReader();
    r.onload = () => { try { const parsed = JSON.parse(r.result); const st = parsed.state || parsed; if (!st.expenses || !st.settings) throw 0; S = Object.assign(defaultState(), st); S.settings = Object.assign(defaultState().settings, st.settings); save(); hideOverlay(); render(); toast('✓ Data restored'); } catch (err) { toast('Not a valid backup'); } };
    r.readAsText(file); e.target.value = '';
  });

  // receipts
  let receiptTarget = null; // 'tap' | 'edit'
  function compressImage(file) {
    return new Promise((res, rej) => { const rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = () => { const max = 1000; let w = img.width, h = img.height; if (w > h && w > max) { h = h * max / w; w = max; } else if (h > max) { w = w * max / h; h = max; } const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h); res(cv.toDataURL('image/jpeg', 0.5)); }; img.onerror = rej; img.src = rd.result; }; rd.onerror = rej; rd.readAsDataURL(file); });
  }
  fileReceipt.addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
    try { const data = await compressImage(file); ui.receipt = data; render(); toast('✓ Receipt added'); } catch (err) { toast('Could not read image'); }

  screen.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return; const act = el.dataset.act;
    if (act === 'key') tapKey(el.dataset.k);
    else if (act === 'back') { ui.entry = ui.entry.slice(0, -1); updateTap(); vibrate(8); }
    else if (act === 'flownext') { if ((parseFloat(ui.entry) || 0) > 0) { ui.step = 2; render(); vibrate(6); } }
    else if (act === 'flowback') { if (ui.step === 3) { ui.note = (document.getElementById('noteInput') || {}).value || ui.note; } ui.step = Math.max(1, ui.step - 1); render(); }
    else if (act === 'flowcancel') { resetDraft(); render(); }
    else if (act === 'pickcat') { ui.cat = el.dataset.n; ui.step = 3; render(); vibrate(6); }
    else if (act === 'flowdone') tapSave();
    else if (act === 'credit') { ui.note = (document.getElementById('noteInput') || {}).value || ui.note; ui.credit = !ui.credit; render(); }
    else if (act === 'method') { ui.note = (document.getElementById('noteInput') || {}).value || ui.note; ui.method = el.dataset.m; render(); }
    else if (act === 'qamt') { ui.entry = String(el.dataset.a); updateTap(); vibrate(6); }
    else if (act === 'qnote') { ui.note = el.dataset.n; const inp = document.getElementById('noteInput'); if (inp) inp.value = ui.note; }

    else if (act === 'togglesearch') { ui.searchOpen = !ui.searchOpen; if (!ui.searchOpen) ui.search = ''; render(); const inp = document.getElementById('searchInput'); if (inp && ui.searchOpen) inp.focus(); }
    else if (act === 'filter') { ui.filter = el.dataset.f; render(); }

  function renderHistoryList() { /* light re-render of list only, keep search focus */ const inner = screen.querySelector('.screen-inner'); if (!inner) { render(); return; } const scroll = screen.scrollTop; render(); const inp = document.getElementById('searchInput'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } screen.scrollTop = scroll; }
  function syncChips(id, sel, act, dataAttr) { const box = document.getElementById(id); if (!box) return; const key = dataAttr || 'n'; [...box.children].forEach(c => c.classList.toggle('sel', c.dataset[key] === sel)); }

  overlay.addEventListener('click', e => {
    // backdrop close for sheets only
    if (!e.target.closest('[data-stop]')) { if (!overlay.classList.contains('full-mode')) hideOverlay(); return; }
    const el = e.target.closest('[data-act]'); if (!el) return; const act = el.dataset.act; const v = el.dataset;

    // edit sheet
    if (act === 'closeview') return hideOverlay();
    if (act === 'viewreceipt') { showReceiptViewer(viewState.receipt); return; }
    if (act === 'closeviewer') { renderView(); return; }

    // settings nav
    if (act === 'ovnav') { ov.view = v.v; if (v.v === 'cats') {} renderOverlay(); return; }
    if (act === 'ovback') { ov.view = 'home'; renderOverlay(); return; }
    if (act === 'about') { ov = { view: 'about' }; renderOverlay(); return; }

    // budgets
    if (act === 'budgetssave') {
      const mv = parseInt(String(document.getElementById('budMonthly').value).replace(/[^0-9]/g, ''), 10); if (mv >= 0) S.settings.budget = mv;
      document.querySelectorAll('[data-catbud]').forEach(inp => { const n = inp.getAttribute('data-catbud'); const val = parseInt(String(inp.value).replace(/[^0-9]/g, ''), 10); if (val > 0) S.settings.catBudgets[n] = val; else delete S.settings.catBudgets[n]; });
      save(); ov.view = 'home'; renderOverlay(); render(); toast('✓ Budgets saved'); return;
    }

    // categories
    if (act === 'catnew') { catDraft = { n: '', e: '', c: PALETTE[0], orig: null }; ov.view = 'catEdit'; renderOverlay(); return; }
    if (act === 'catedit') { const c = catOf(v.n); catDraft = { n: c.n, e: c.e, c: c.c, orig: c.n }; ov.view = 'catEdit'; renderOverlay(); return; }
    if (act === 'catcolor') { catDraft.c = v.c; document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.c === v.c)); return; }
    if (act === 'catsave') {
      const name = document.getElementById('catName').value.trim(); const emoji = document.getElementById('catEmoji').value.trim() || '🏷️';
      if (!name) { toast('Enter a name'); return; }
      if (catDraft.orig) { const c = S.categories.find(x => x.n === catDraft.orig); const oldName = c.n; c.e = emoji; c.c = catDraft.c; if (name !== oldName) { if (S.categories.some(x => x.n === name)) { toast('Name already exists'); return; } c.n = name; S.expenses.forEach(x => { if (x.cat === oldName) x.cat = name; }); S.recurring.forEach(x => { if (x.cat === oldName) x.cat = name; }); if (S.settings.catBudgets[oldName] != null) { S.settings.catBudgets[name] = S.settings.catBudgets[oldName]; delete S.settings.catBudgets[oldName]; } } }
      else { if (S.categories.some(x => x.n === name)) { toast('Name already exists'); return; } S.categories.push({ n: name, e: emoji, c: catDraft.c }); }
      save(); ov.view = 'cats'; renderOverlay(); return;
    }
    if (act === 'catdel') { if (catInUse(v.n)) { toast('Category in use'); return; } S.categories = S.categories.filter(c => c.n !== v.n); delete S.settings.catBudgets[v.n]; save(); renderOverlay(); return; }

    // methods
    if (act === 'methodadd') { const val = document.getElementById('methodNew').value.trim(); if (!val) return; if (methods().includes(val)) { toast('Already exists'); return; } S.settings.methods.push(val); save(); renderOverlay(); return; }
    if (act === 'methoddel') { if (methods().length <= 1) return; S.settings.methods = methods().filter(m => m !== v.m); save(); renderOverlay(); return; }

    // recurring
    if (act === 'recnew') { recDraft = { id: null, amount: '', cat: getCats()[0].n, note: '', dayOfMonth: 1, credit: false, active: true }; ov.view = 'recEdit'; renderOverlay(); return; }
    if (act === 'recedit') { const r = S.recurring.find(x => x.id === Number(v.id)); if (r) { recDraft = { ...r }; ov.view = 'recEdit'; renderOverlay(); } return; }
    if (act === 'recdel') { S.recurring = S.recurring.filter(x => x.id !== Number(v.id)); save(); renderOverlay(); return; }
    if (act === 'rcat') { recDraft.cat = v.n; syncChips('recChips', recDraft.cat, 'rcat'); return; }
    if (act === 'rcredit') { recDraft.credit = !recDraft.credit; el.classList.toggle('on', recDraft.credit); return; }
    if (act === 'ractive') { recDraft.active = !recDraft.active; el.classList.toggle('on', recDraft.active); return; }
    if (act === 'recsave') {
      const amount = parseFloat(document.getElementById('recAmount').value) || 0; if (!(amount > 0)) { toast('Enter an amount'); return; }
      let day = parseInt(document.getElementById('recDay').value, 10) || 1; day = Math.max(1, Math.min(31, day));
      const note = document.getElementById('recNote').value.trim();
      if (recDraft.id) { const r = S.recurring.find(x => x.id === recDraft.id); Object.assign(r, { amount, cat: recDraft.cat, note, dayOfMonth: day, credit: recDraft.credit, active: recDraft.active }); }
      else S.recurring.push({ id: S.nextId++, amount, cat: recDraft.cat, note, dayOfMonth: day, credit: recDraft.credit, active: true, method: methods()[0], lastPosted: null });
      const posted = postDueRecurring(); save(); ov.view = 'recurring'; renderOverlay(); if (posted) render(); toast('✓ Saved' + (posted ? ' & posted' : '')); return;
    }

    // currency
    if (act === 'setcurrency') { S.settings.currency = v.s; save(); renderOverlay(); render(); toast('✓ Currency ' + v.s); return; }

    // pin
    if (act === 'togglelock') { if (S.settings.lockEnabled) { S.settings.lockEnabled = false; save(); renderOverlay(); toast('Lock off'); } else { if (!S.settings.pin) { toast('Set a PIN first'); } else { S.settings.lockEnabled = true; save(); renderOverlay(); toast('Lock on'); } } return; }
    if (act === 'pinsave') { const a = document.getElementById('pin1').value, b = document.getElementById('pin2').value; if (!/^\d{4}$/.test(a)) { toast('PIN must be 4 digits'); return; } if (a !== b) { toast('PINs don\'t match'); return; } S.settings.pin = a; S.settings.lockEnabled = true; save(); ov.view = 'home'; renderOverlay(); toast('✓ PIN set'); return; }

    // backup
    if (act === 'export') return exportJSON();
    if (act === 'exportcsv') return exportCSV();
    if (act === 'import') { fileImport.click(); return; }
    if (act === 'resetall') { if (confirm('Delete ALL data permanently? This cannot be undone.')) { S = defaultState(); save(); hideOverlay(); render(); toast('All data cleared'); } return; }

    // shortcut
    if (act === 'copyurl') { copyText(deepLinkBase()); return; }
    if (act === 'copytemplate') { copyText(deepLinkBase() + '?add=1&amt=AMOUNT&cat=CATEGORY&note=NOTE'); return; }
    if (act === 'testshortcut') { const c = getCats()[0]; location.href = deepLinkBase() + '?add=1&amt=1&cat=' + encodeURIComponent(c.n) + '&note=' + encodeURIComponent('Test via shortcut'); return; }

    // lock
    if (act === 'lockkey') return lockKey(v.k);
    if (act === 'lockback') { lockEntry = lockEntry.slice(0, -1); document.querySelectorAll('#lockEl .dots i').forEach((el2, i) => el2.classList.toggle('on', i < lockEntry.length)); return; }

    // onboarding
    if (act === 'obcur') { S.settings.currency = v.s; document.querySelectorAll('#obCur .chip').forEach(c => c.classList.toggle('sel', c.dataset.s === v.s)); return; }
    if (act === 'obdone') { const b = parseInt(String(document.getElementById('obBudget').value).replace(/[^0-9]/g, ''), 10); if (b >= 0) S.settings.budget = b; S.settings.onboarded = true; save(); hideOverlay(); render(); toast('Welcome 👋'); return; }
  });

  function showReceiptViewer(src) { overlay.className = 'overlay show full-mode'; overlay.innerHTML = `<div style="width:100%;height:100%;display:flex;flex-direction:column;background:#000" data-stop><div style="padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;justify-content:flex-end"><button class="iconbtn" data-act="closeviewer">✕</button></div><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:16px"><img src="${src}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:12px"></div></div>`; }

  // ---------------- boot ----------------
  // ---------------- deep-link quick add (iOS Back Tap / Siri Shortcut) ----------------
  // A Shortcut collects amount/category/note natively, then opens the app at
  //   ?add=1&amt=250&cat=Junk%20food&note=KFC[&credit=1][&method=UPI]
  // We read those params on load, store the expense, and clean the URL so a
  // refresh never double-posts. Unknown categories are created on the fly.
  let pendingShortcutToast = false;
  function emojiForName(name) {
    const g = guessCategory(name); if (g) { const c = S.categories.find(x => x.n === g); if (c) return c.e; }
    const map = { travel: '✈️', grooming: '💇', lending: '🤝', salary: '💰', grocery: '🛒', groceries: '🛒', gift: '🎁', bill: '🧾', food: '🍽️', coffee: '☕', pet: '🐾', kids: '🧸', donation: '❤️', invest: '📈' };
    const t = String(name).toLowerCase(); for (const k in map) if (t.includes(k)) return map[k];
    return '🏷️';
  }
  function cleanUrl() { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  function handleDeepLink() {
    let p; try { p = new URLSearchParams(location.search); } catch (e) { return false; }
    if (!p.get('add')) return false;
    const amount = parseFloat(String(p.get('amt') || p.get('amount') || '').replace(/[^0-9.]/g, '')) || 0;
    if (!(amount > 0)) { cleanUrl(); return false; }
    const note = (p.get('note') || '').trim();
    let cat = null; const catName = (p.get('cat') || p.get('category') || '').trim();
    if (catName) { const found = S.categories.find(c => c.n.toLowerCase() === catName.toLowerCase()); if (found) cat = found.n; else { S.categories.push({ n: catName, e: emojiForName(catName), c: PALETTE[S.categories.length % PALETTE.length] }); cat = catName; } }
    if (!cat) cat = guessCategory(note) || 'Other';
    const credit = p.get('credit') === '1' || p.get('credit') === 'true';
    const mParam = p.get('method'); const method = mParam && methods().includes(mParam) ? mParam : methods()[0];
    S.expenses.push({ id: S.nextId++, amount, cat, note, credit, method, ts: Date.now(), viaShortcut: true });
    S.settings.onboarded = true; save(); cleanUrl();
    ui.tab = 'history'; pendingShortcutToast = true; return true;
  }

  // ---------------- tap ripple ----------------
  // A soft expanding circle at the finger on every tappable element, for a
  // more physical feel. Purely decorative and pointer-events:none, so it never
  // interferes with the actual button handlers.
  const RIPPLE_SEL = 'button, .chip, .cat-item, .exp, .setrow, .listitem, .filter, .seg button, .mchip, .qchip, .swatch, .pill, .key, .lockkey, .iconbtn, .clip, .credit-toggle, .act, .addbtn, .receipt-thumb, [data-act], [data-tab]';
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion) {
    document.addEventListener('pointerdown', e => {
      const t = e.target.closest(RIPPLE_SEL); if (!t) return;
      const r = document.createElement('span'); r.className = 'tap-ripple';
      r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
      document.body.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
      setTimeout(() => r.remove(), 700);
    }, { passive: true });
  }

  function afterUnlock() { if (!S.settings.onboarded) { showOnboarding(); return; } hideOverlay(); if (pendingShortcutToast) { pendingShortcutToast = false; toast('✓ Added via Shortcut'); } }
  function boot() {
    postDueRecurring();
    const added = handleDeepLink();
    render();
    if (S.settings.lockEnabled && S.settings.pin) { showLock(); return; }
    if (!S.settings.onboarded) { showOnboarding(); return; }
    if (added && pendingShortcutToast) { pendingShortcutToast = false; toast('✓ Added via Shortcut'); }
  }
  boot();

  if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); }); }
})();
</script>
